name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── Python ───
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup UV
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync

      # ─── Node / pnpm (via corepack, no extra action needed) ───
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Install frontend dependencies
        run: cd frontend && pnpm install

      # ─── Generate data (YAML → JSON / OPML / Markdown) ───
      - name: Fix filenames & export data
        run: uv run make data

      # ─── Build frontend ───
      - name: Build Svelte site
        run: cd frontend && pnpm run build

      # ─── Commit updated README / index.md back to main ───
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md index.md || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update generated files [skip ci]"
            git push
          fi

      # ─── Deploy to GitHub Pages ───
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
